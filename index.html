  <style>
    :root {
      --ink: #17251f;
      --muted: #65716b;
      --green: #285b45;
      --green-dark: #173d2c;
      --lime: #c7e36a;
      --paper: #f7f8f4;
      --white: #fff;
      --line: #e6e9e2;
      --radius: 18px;
      --shadow: 0 18px 55px rgba(25, 42, 33, .11);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 92px; }
    body {
      margin: 0;
      font-family: "Manrope", Arial, sans-serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.6;
    }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .container { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
    .section { padding: 92px 0; }
    .section--white { background: var(--white); }
    .eyebrow {
      display: inline-flex; gap: 9px; align-items: center;
      color: var(--green); font-size: 12px; font-weight: 800;
      letter-spacing: .12em; text-transform: uppercase;
    }
    .eyebrow::before { content: ""; width: 22px; height: 2px; background: var(--lime); }
    h1, h2, h3, p { margin-top: 0; }
    h1, h2, h3 { line-height: 1.12; letter-spacing: -.04em; }
    h1 { font-size: clamp(38px, 6vw, 67px); margin: 18px 0 20px; }
    h2 { font-size: clamp(32px, 4vw, 48px); margin: 14px 0; }
    h3 { font-size: 21px; }
    .lead { color: var(--muted); font-size: 17px; max-width: 650px; }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 30px; margin-bottom: 36px; }
    .section-head p { margin: 0; max-width: 460px; color: var(--muted); }

    .topline { background: #11251b; color: rgba(255,255,255,.8); font-size: 12px; }
    .topline-inner { min-height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
    .topline a:hover { color: var(--lime); }
    .topline-right { display: flex; gap: 20px; }

    .header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(255,255,255,.95); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(20, 40, 28, .08);
    }
    .nav { min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 25px; }
    .brand { display: flex; align-items: center; gap: 11px; flex: 0 0 auto; }
